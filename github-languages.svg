<svg xmlns="http://www.w3.org/2000/svg" width="480" height="212" viewBox="0 0 480 212">
<title>Most used languages by code size</title>
<rect x=".5" y=".5" width="479" height="211" rx="10" fill="#0d1117" stroke="#30363d"/>
<g fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13">
<text x="20" y="27" font-size="16" font-weight="600">Most used languages</text>
<text x="20" y="46" fill="#9da7b3">Code size across selected public repositories</text>
<text x="20" y="73">Go</text><rect x="138" y="63" width="245" height="9" rx="4" fill="#30363d"/><rect x="138" y="63" width="109.6" height="9" rx="4" fill="#2f81f7"/><text x="460" y="73" text-anchor="end">44.7%</text>
<text x="20" y="103">TypeScript</text><rect x="138" y="93" width="245" height="9" rx="4" fill="#30363d"/><rect x="138" y="93" width="55.1" height="9" rx="4" fill="#2da44e"/><text x="460" y="103" text-anchor="end">22.5%</text>
<text x="20" y="133">Python</text><rect x="138" y="123" width="245" height="9" rx="4" fill="#30363d"/><rect x="138" y="123" width="38.6" height="9" rx="4" fill="#8250df"/><text x="460" y="133" text-anchor="end">15.7%</text>
<text x="20" y="163">JavaScript</text><rect x="138" y="153" width="245" height="9" rx="4" fill="#30363d"/><rect x="138" y="153" width="24.0" height="9" rx="4" fill="#bf8700"/><text x="460" y="163" text-anchor="end">9.8%</text>
<text x="20" y="193">CSS</text><rect x="138" y="183" width="245" height="9" rx="4" fill="#30363d"/><rect x="138" y="183" width="12.4" height="9" rx="4" fill="#db61a2"/><text x="460" y="193" text-anchor="end">5.1%</text>
</g>
</svg>
