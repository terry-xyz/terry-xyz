name: Profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: profile-metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: terry-xyz
          filename: github-metrics.svg
          base: ''
          plugin_isocalendar: 'yes'
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: 'yes'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Refresh public repository language card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/languages.py
          git add github-languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Update github-languages.svg'
          git push
